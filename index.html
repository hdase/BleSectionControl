<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#101418">
<title>BleSectionControl</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M4 12h16" stroke="currentColor" stroke-width="3" stroke-linecap="round" fill="none"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M20 12H5M11 5l-7 7 7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M4 12h15M13 5l7 7-7 7" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9M6.3 6.8a8 8 0 1 0 11.4 0" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></symbol>
  </defs>
</svg>

<header>
  <h1>BleSectionControl</h1>
  <button id="connect" class="primary">Verbinden</button>
</header>

<section id="status" aria-live="polite">
  <div class="row"><span class="dot" id="d-ble"></span><span>Handy ↔ ESP32</span><b id="t-ble">getrennt</b></div>
  <div class="row"><span class="dot" id="d-bus"></span><span>ESP32 ↔ ISOBUS</span><b id="t-bus">–</b></div>
  <div class="row"><span class="dot" id="d-aux"></span><span>AUX-N</span><b id="t-aux">–</b></div>
  <div id="alert" hidden></div>
</section>

<main id="pad">
  <button class="key" data-bit="0"><svg><use href="#i-plus"/></svg><svg><use href="#i-left"/></svg><span>Links ein</span></button>
  <button class="key" data-bit="2"><svg><use href="#i-plus"/></svg><svg><use href="#i-right"/></svg><span>Rechts ein</span></button>
  <button class="key" data-bit="1"><svg><use href="#i-minus"/></svg><svg><use href="#i-right"/></svg><span>Links aus</span></button>
  <button class="key" data-bit="3"><svg><use href="#i-minus"/></svg><svg><use href="#i-left"/></svg><span>Rechts aus</span></button>
  <button class="key wide" data-bit="4"><svg><use href="#i-power"/></svg><span>Hauptschalter</span></button>
</main>

<details id="fw">
  <summary>Firmware</summary>
  <p>Installiert: <b id="fw-ver">–</b></p>
  <button id="fw-check">Nach Update suchen</button>
  <button id="fw-fetch" hidden>Firmware laden</button>
  <button id="fw-install" hidden>Installieren</button>
  <p id="fw-online-msg"></p>
  <label>Firmware-Datei (manuell) <input id="file" type="file" accept=".bin"></label>
  <button id="update">Update installieren</button>
  <progress id="prog" value="0" max="100" hidden></progress>
  <p id="fw-msg"></p>
</details>

<details id="diag">
  <summary>CAN-Diagnose</summary>
  <p>Der ESP32 zeichnet den CAN-Verkehr laufend auf. Nach einem Problem hier herunterladen.</p>
  <button id="dl-trace">CAN-Trace speichern (.asc)</button>
  <button id="dl-events">Ereignislog speichern (.txt)</button>
  <progress id="tprog" value="0" max="100" hidden></progress>
  <p id="diag-msg"></p>
</details>

<footer>App <span id="app-ver">–</span> · Firmware <span id="fw-ver2">–</span></footer>

<script src="version.js"></script>
<script src="app.js"></script>
</body>
</html>
